name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["website/**", "*.md"]
  pull_request:
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build PhoneSentry.exe
        shell: pwsh
        run: ./build.ps1

      - name: Smoke test (sample reports, no phone needed)
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m phonesentry.demo build-tmp\samples

      - name: Checksum
        shell: pwsh
        run: (Get-FileHash dist\PhoneSentry.exe -Algorithm SHA256).Hash.ToLower() + "  PhoneSentry.exe" | Out-File -Encoding ascii dist\PhoneSentry.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneSentry-windows
          path: |
            dist/PhoneSentry.exe
            dist/PhoneSentry.exe.sha256
